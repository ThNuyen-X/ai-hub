<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="horn-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="bull-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- GEOMETRIC MINIMALIST CYBER BULL HEAD -->
  <g filter="url(#bull-glow)">
    <!-- Horns -->
    <!-- Left Horn -->
    <path d="M 160 210 C 95 170, 35 85, 75 25 C 105 55, 145 115, 185 165 Z" fill="url(#horn-gold)" />
    <!-- Right Horn -->
    <path d="M 352 210 C 417 170, 477 85, 437 25 C 407 55, 367 115, 327 165 Z" fill="url(#horn-gold)" />

    <!-- Forehead Crown Armor -->
    <polygon points="256,90 330,170 256,210 182,170" fill="#0f172a" stroke="url(#core-glow)" stroke-width="6" stroke-linejoin="round" />

    <!-- Central Shield Plate -->
    <polygon points="182,170 330,170 348,290 256,380 164,290" fill="url(#cyber-cyan)" />

    <!-- Cheek Lateral Facets -->
    <polygon points="164,290 256,380 256,430 135,325" fill="#0284c7" opacity="0.9" />
    <polygon points="348,290 256,380 256,430 377,325" fill="#1e40af" opacity="0.9" />

    <!-- Muzzle / Snout Plate -->
    <polygon points="216,360 296,360 280,415 232,415" fill="#090d16" stroke="url(#horn-gold)" stroke-width="4" />

    <!-- Golden Nose Ring -->
    <circle cx="256" cy="430" r="36" fill="none" stroke="url(#horn-gold)" stroke-width="12" />

    <!-- Sharp Glowing Cyber Eyes -->
    <polygon points="198,240 240,248 208,260" fill="#fef08a" />
    <polygon points="314,240 272,248 304,260" fill="#fef08a" />
  </g>
</svg>