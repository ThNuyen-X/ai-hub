<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rigged Doraemon 3D Model</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0f172a;
    color: #f8fafc;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  h1 { margin: 0; color: #38bdf8; font-size: 22px; }
  .viewer-box {
    position: relative;
    width: 600px;
    height: 600px;
    background: #1e293b;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  #canvas3d { width: 100%; height: 100%; display: block; }
  #status { font-size: 14px; color: #94a3b8; }
</style>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
</head>
<body>
  <h1>Mô hình 3D Doraemon Rigged (Lấy từ GitHub)</h1>
  <div id="status">Đang nạp mô hình 3D rigged...</div>
  <div class="viewer-box">
    <canvas id="canvas3d"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas3d');
    const status = document.getElementById('status');
    const width = 600;
    const height = 600;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 1.2, 3.5);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight1.position.set(3, 5, 4);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.8);
    dirLight2.position.set(-3, -2, -3);
    scene.add(dirLight2);

    let doraemonModel = null;
    let bones = {};

    const loader = new THREE.GLTFLoader();
    loader.load('/doraemon_rigged.glb', (gltf) => {
      doraemonModel = gltf.scene;

      const box = new THREE.Box3().setFromObject(doraemonModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.0 / maxDim;

      doraemonModel.scale.set(scale, scale, scale);
      doraemonModel.position.x = -center.x * scale;
      doraemonModel.position.y = -center.y * scale;
      doraemonModel.position.z = -center.z * scale;

      doraemonModel.traverse(child => {
        if (child.isBone) {
          bones[child.name] = child;
        }
        if (child.isMesh && child.material) {
          child.material.roughness = 0.4;
          child.material.metalness = 0.1;
        }
      });

      scene.add(doraemonModel);
      status.textContent = 'Đã nạp thành công mô hình 3D Rigged từ GitHub! Số xương: ' + Object.keys(bones).length;
      console.log('Bones:', Object.keys(bones));
    }, undefined, (err) => {
      status.textContent = 'Lỗi nạp: ' + err.message;
      console.error(err);
    });

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Cử động 3D thử nghiệm bằng xương thực tế:
      if (bones.RightArm) {
        bones.RightArm.rotation.z = Math.sin(t * 3) * 0.4 - 0.8; // vẫy tay phải
      }
      if (bones.LeftArm) {
        bones.LeftArm.rotation.z = -Math.sin(t * 3) * 0.4 + 0.8;
      }
      if (bones.Head) {
        bones.Head.rotation.y = Math.sin(t * 2) * 0.3; // lắc đầu
      }
      if (doraemonModel) {
        doraemonModel.rotation.y = Math.sin(t * 0.8) * 0.4; // lắc lư toàn thân
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
